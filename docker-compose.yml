# LLM API debug proxy (puppetllm) — standalone.
#
# Stand up a fake server compatible with the Anthropic Messages API / Bedrock /
# OpenAI Chat Completions on localhost, and point ANTHROPIC_BASE_URL /
# AnthropicBedrock base_url / OPENAI_BASE_URL at it to do human-in-the-loop debugging
# without changing a single line of SDK code.
# Cost estimates / pseudo prompt-cache observation are included too. Details: README.md
#
# Start:   docker compose up -d
# SDK:     docker compose --profile agent-sdk up -d --build
# Control: curl localhost:8765/_control/health ; curl localhost:8765/_control/pending | jq
# Tests:   docker compose --profile test run --rm proxy-test

name: puppetllm

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: puppetllm:latest
    container_name: puppetllm
    ports:
      - "127.0.0.1:8765:8765"   # localhost-only (do not expose the control plane externally)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/_control/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: "no"

  # Opt-in SDK relay; the regular `up -d` keeps its existing server-only behavior.
  agent-sdk-relay:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-sdk
    image: puppetllm:agent-sdk
    profiles: ["agent-sdk"]
    init: true
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - agent-sdk-state:/var/lib/puppetllm/sdk
    healthcheck:
      test: ["CMD", "python3", "-c", "from puppetllm.sdk_state import read_status; import sys; sys.exit(0 if read_status('/var/lib/puppetllm/sdk')['ready'] else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    command:
      - python3
      - -m
      - puppetllm
      - relay
      - --kind
      - agent-sdk
      - --puppet
      - http://proxy:8765
      - --target
      - ${PUPPETLLM_AGENT_SDK_TARGET:-https://api.anthropic.com}
      - --model
      - ${PUPPETLLM_AGENT_SDK_MODEL:-claude-opus-5-5}
      - --max-concurrency
      - ${PUPPETLLM_AGENT_SDK_CONCURRENCY:-4}
      - --timeout
      - ${PUPPETLLM_AGENT_SDK_TIMEOUT:-600}
      - --sdk-api-retries
      - ${PUPPETLLM_AGENT_SDK_API_RETRIES:-0}
      - --sdk-max-api-requests
      - ${PUPPETLLM_AGENT_SDK_MAX_API_REQUESTS:-1}
      - --sdk-structured-retries
      - ${PUPPETLLM_AGENT_SDK_STRUCTURED_RETRIES:-1}
      - --sdk-max-turns
      - ${PUPPETLLM_AGENT_SDK_MAX_TURNS:-1}
      - --sdk-effort
      - ${PUPPETLLM_AGENT_SDK_EFFORT:-high}
      - --sdk-max-output-tokens
      - ${PUPPETLLM_AGENT_SDK_MAX_OUTPUT_TOKENS:-auto}
      - --sdk-idle-warning
      - ${PUPPETLLM_AGENT_SDK_IDLE_WARNING:-120}
      - --sdk-max-buffer-bytes
      - ${PUPPETLLM_AGENT_SDK_MAX_BUFFER_BYTES:-4194304}
      - --sdk-cache-ttl
      - ${PUPPETLLM_AGENT_SDK_CACHE_TTL:-5m}
      - --price-by
      - upstream
    restart: "no"

  # Stays available when the billable worker is stopped. No upstream credentials.
  agent-sdk-watchdog:
    image: puppetllm:agent-sdk
    profiles: ["agent-sdk"]
    init: true
    depends_on:
      proxy:
        condition: service_healthy
    volumes:
      - agent-sdk-state:/var/lib/puppetllm/sdk:ro
    ports:
      - "127.0.0.1:8766:8766"
    command: ["python3", "-m", "puppetllm.sdk_state", "watch", "--proxy", "http://proxy:8765", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8766/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: "no"

  # For running the unit tests (opt-in).
  proxy-test:
    image: puppetllm:latest
    container_name: puppetllm-test
    profiles: ["test"]
    depends_on:
      - proxy   # share the build
    working_dir: /app
    environment:
      # Fail loudly if the image lacks boto3 instead of skipping the SDK-level tests.
      PUPPETLLM_REQUIRE_SDK_TESTS: "1"
    command: ["python3", "-m", "unittest",
              "puppetllm.tests.test_fake_server",
              "puppetllm.tests.test_proxy_extensions",
              "puppetllm.tests.test_batches",
              "puppetllm.tests.test_conformance",
              "puppetllm.tests.test_bedrock_extras",
              "puppetllm.tests.test_harness",
              "puppetllm.tests.test_compat",
              "puppetllm.tests.test_observability",
              "puppetllm.tests.test_extras",
              "puppetllm.tests.test_boto3_interop", "-v"]
    restart: "no"

volumes:
  agent-sdk-state:
